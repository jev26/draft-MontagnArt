  <style>
    .section-spacing {
      padding: 90px 0;
    }

    .gallery-item {
      height: 400px;
      position: relative;
      overflow: hidden;

      transform: translateY(30px);
      transition: all 0.6s ease;
    }

    @media (max-width: 768px) {
      .gallery-item {
        height: 300px;
      }
    }

    .gallery-item .image-block {
      height: 100%;
    }

    .gallery-item h2,
    .gallery-item h5 {
      margin: 0;
    }

    .image-block {
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: transform 0.4s ease;
    }

    .gallery-item:hover .image-block {
      transform: scale(1.05);
    }

    .filter-btn.active {
      background-color: var(--color-primary);
      color: var(--color-white);
    }

    .gallery-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Container boutons filtres */
    .filter-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* Boutons filtres */
    .filter-btn {
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      min-width: fit-content;
    }

    /* Hover desktop */
    .filter-btn:hover {
      transform: translateY(-2px);
    }

    /* Etat actif */
    .filter-btn.active {
      background-color: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }

    /* Mobile */
    @media (max-width: 768px) {

      .filter-container {
        gap: 8px;
        padding: 0 12px;
      }

      .filter-btn {
        font-size: 0.85rem;
        padding: 8px 14px;
      }

    }

/*Style section de shop*/

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 9999;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 85%;
      border-radius: 10px;
    }

    .lightbox .close {
      position: absolute;
      top: 30px;
      right: 40px;
      font-size: 40px;
      color: white;
      cursor: pointer;
    }

    .clickable-img {
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .clickable-img:hover {
      transform: scale(1.05);
    }  

    .image-painting {
    cursor: zoom-in;
}

.image-painting:hover {
    transform: scale(1.05);
}

.clickable-img {
    cursor: zoom-in;
}

    /* Hover seulement desktop */
    @media (hover: hover) {
      .product-card:hover {
        transform: translateY(-5px) scale(1.05);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }

      .small-img:hover {
        transform: scale(1.1);
      }
    }

    @media (max-width: 576px) {
      .product-info {
        padding: 10px;
      }
    }

    img {
      max-width: 100%;
      height: auto;
    }

    #cart-box {
      font-size: 0.85rem;

    }

    @media (max-width: 576px) {
      #cart-box {
        width: 100%;
        left: 0;
        right: 0;
        bottom: 0;
        border-radius: 0;

    }

  <!-- Ajouter Lightbox -->
  <div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <img class="lightbox-content" id="lightbox-img">
  </div>

  <script>
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const closeBtn = document.querySelector(".lightbox .close");

// Images <img> ET div.image-painting
document.querySelectorAll(".clickable-img").forEach(element => {

  element.addEventListener("click", () => {

    let imageSrc;

    if (element.tagName === "IMG") {
      imageSrc = element.src;
    } else {
      // récupère l'URL du background-image
      imageSrc = window.getComputedStyle(element)
        .backgroundImage
        .replace(/^url\(["']?/, "")
        .replace(/["']?\)$/, "");
    }

    lightboxImg.src = imageSrc;
    lightbox.style.display = "flex";
  });

});

closeBtn.addEventListener("click", () => {
  lightbox.style.display = "none";
});

lightbox.addEventListener("click", e => {
  if (e.target === lightbox) {
    lightbox.style.display = "none";
  }
});

// Fermer avec Échap
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    lightbox.style.display = "none";
  }
});
</script>
