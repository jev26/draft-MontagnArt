<!DOCTYPE html>
<html lang="fr">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CHY79CGXQ2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-CHY79CGXQ2');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Montagn'Art</title>

  <link rel="icon" type="image/png" href="/img/montagnart-favicon-site.png" />

  <!-- Lien vers Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  
  <link rel="stylesheet" href="styles.css" />

  <style>
    .btn-white {
    display: inline-block;
    text-align: center;
    max-width: 280px;
}

    @media (max-width: 576px) {
      .btn-white {
        font-size: 0.9rem;
        padding: 8px 14px;
        white-space: nowrap;
      }
    }
  </style>
</head>

<body>
  <!-- Header -->
  <header class="header-img header-contact">

    <!-- Navbar -->
     <div id="header" data-navbar="navbar-img" data-logo="img/montagnart-logo-blanc.png">
    </div>

    <script>
      async function loadHeader() {

        const header = document.getElementById("header");

        const response = await fetch("components/header.html");

        const data = await response.text();

        header.innerHTML = data;

        // récupère config page
        const navbarClass = header.dataset.navbar;
        const logo = header.dataset.logo;

        // applique classe navbar
        document
          .getElementById("main-navbar")
          .classList.add(navbarClass);

        // applique logo
        document
          .getElementById("navbar-logo")
          .src = logo;
      }

      loadHeader();
    </script>

    <!-- Overlay Text -->
    <!--<div class="overlay-text">
        Randonnons ensemble
      </div>-->
  </header>

  <!-- Section contact -->
  <section class="section-main py-5">
    <div class="container">
      <div class="row align-items-center" style="min-height: 250px;">

        <div class="col-12 col-md-4 d-flex align-items-center justify-content-center">
          <img src="img/montagnart-logo-couleur.png" alt="Montagn'Art logo" style="width: 50%;" />
        </div>

        <div class="col-12 col-md-4">
          <div class="container text-center">
            <h2 class="mt-4">Contactez-moi</h2>
            <h5>Tessy Veillard - Montagn'Art</h5>
            <a href="mailto:contact@montagn-art.ch">contact@montagn-art.ch</a>
            <br>
            <a href="https://wa.me/41762061997?text=Bonjour%20je%20souhaite%20plus%20d'informations"> +41 76 206 19
              97</a>
          </div>
        </div>

        <div class="col-12 col-md-4 d-flex align-items-center justify-content-center">
          <img src="img/asamswl.webp" alt="ASAM-SWL logo" style="width: 50%;">
        </div>
      </div>
    </div>
  </section>


  <!-- section newletter -->
  <section class="section-main container-fluid g-0">
    <div class="image-block img-fluid d-flex align-items-center justify-content-center"
      style="background-image: url('img/Montagn-art_Inscription_newsletter.webp'); background-repeat:no-repeat; background-position: center; height: 300px;">
      <div class="text mt-3 text-center" style="color: #ffe4d4; text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.7);">
        <h2 class="mb-4"> Restes au courant des prochaines randonnées </h2>
        <a class="btn-white px-4 py-2" href="https://forms.gle/AYrozKR3rfF5oqaZ9">
          S'inscrire à la Newsletter</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <div id="footer"></div>

  <script>
    fetch("components/footer.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("footer").innerHTML = data;

        // bouton retour haut
        const backToTop = document.querySelector(".back-to-top");

        backToTop?.addEventListener("click", (e) => {
          e.preventDefault();

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });
        });
      });
  </script>
</body>

</html>
